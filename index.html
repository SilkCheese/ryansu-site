f=\"https://qhst2026.calicotab.com/qhst2026/\">Queen’s HST 2026\u003c/a> — Open quarterfinalist; 4th-place open team; 1st-place junior team; 4th-place junior speaker; 12th-place open speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://hhwo26.calicotab.com/hhwo26/\">Hart House Winter Open\u003c/a> — 9th-place open team (reserve break); 2nd-place junior speaker; 19th-place open speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qho2025.calicotab.com/_/\">Queen’s Holiday Open\u003c/a> — Open partial quarterfinalist; 10th-place junior speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qbs2025.calicotab.com/qbts2025/\">Queen’s Back to School\u003c/a> — Open grand finalist; 2nd-place junior speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qhst2025.calicotab.com/QHST2025/\">Queen’s HST 2025\u003c/a> — Junior champion; 11th-place junior speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://waterloohst.calicotab.com/uwspringhst2025/\">Waterloo HST\u003c/a> — Open quarterfinalist; 18th-place junior speaker.\u003c/li>\n    \u003c/ul>\n  ","\n    \u003ch2>Other Activities\u003c/h2>\n    \u003cul>\n      \u003cli>Outreach manager at the CYCS 2026 Leadership Summit.\u003c/li>\n      \u003cli>Member of the UCC Sustainability Council.\u003c/li>\n      \u003cli>Shortlisted in the junior category of the John Locke Essay Competition and received a commendation. \u003ca href=\"https://docs.google.com/document/d/1MCnwodJLQJXwShR193iVUNzWTWHSKNBJBhwnnqYi-rY/edit?usp=sharing\">Read the essay\u003c/a>.\u003c/li>\n      \u003cli>Canvassed for Vincent Ke and trustee Weidong Pei.\u003c/li>\n    \u003c/ul>\n  "];

<script>
(() => {
  const button=document.querySelector('#sound');
  const iconOn="<svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H3v6h3l5 4Z\"/><path d=\"M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14\"/></svg>",iconOff="<svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H3v6h3l5 4Z\"/><path d=\"m16 9 5 6m0-6-5 6\"/></svg>";
  let desired=true,context=null,master=null,source=null,activated=false;
  try{desired=localStorage.getItem('ryansu-rain-sound')!=='off';}catch{}
  const AudioEngine=window.AudioContext||window.webkitAudioContext;
  function updateButton(){
    const audible=desired&&activated&&context?.state==='running'&&!document.hidden;
    button.innerHTML=audible?iconOn:iconOff;
    button.setAttribute('aria-pressed',String(audible));
    button.setAttribute('aria-label',audible?'Mute rain sound':'Enable rain sound');
    button.title=audible?'Mute rain sound':'Enable rain sound';
  }
  // Generate a quiet stereo rain bed and scattered soft water taps locally.
  function buildAudio(){
    context=new AudioEngine();
    const rate=context.sampleRate,duration=16,frames=Math.floor(rate*duration);
    const buffer=context.createBuffer(2,frames,rate);
    for(let channel=0;channel<2;channel++){
      const data=buffer.getChannelData(channel);
      let smooth=0;
      for(let i=0;i<frames;i++){
        const white=Math.random()*2-1;
        smooth=.965*smooth+.035*white;
        const t=i/rate;
        const swell=.84+.08*Math.sin(2*Math.PI*t/duration)+.04*Math.sin(6*Math.PI*t/duration+channel);
        data[i]=(white*.13+smooth*.7)*swell;
      }
      // Soft, short splashes with varied pitches and spacing.
      for(let d=0;d<105;d++){
        const start=Math.floor(Math.random()*frames),length=Math.floor(rate*(.025+Math.random()*.04));
        const frequency=850+Math.random()*1700,level=.035+Math.random()*.065;
        for(let j=0;j<length;j++){
          const t=j/rate;
          const envelope=Math.min(t/.003,1)*Math.exp(-t*85);
          data[(start+j)%frames]+=level*envelope*(Math.sin(2*Math.PI*frequency*t)*.35+(Math.random()*2-1)*.65);
        }
      }
      // Brief seam fades prevent a click without a noticeable gap.
      const fade=Math.floor(rate*.008);
      for(let i=0;i<fade;i++){data[i]*=i/fade;data[frames-1-i]*=i/fade;}
    }
    source=context.createBufferSource();source.buffer=buffer;source.loop=true;
    const highpass=context.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=350;
    const lowpass=context.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=6200;lowpass.Q.value=.5;
    master=context.createGain();master.gain.value=0;
    source.connect(highpass);highpass.connect(lowpass);lowpass.connect(master);master.connect(context.destination);
    source.start();
    context.addEventListener('statechange',updateButton);
  }
  async function syncAudio(){
    try{
      if(!context&&desired)buildAudio();
      if(!context)return;
      if(desired&&!document.hidden)await context.resume();
      const volume=(desired&&!document.hidden) ? .34 : 0;
      master.gain.cancelScheduledValues(context.currentTime);
      master.gain.setTargetAtTime(volume,context.currentTime,.08);
      if(document.hidden)await context.suspend();
    }catch{
      desired=false;
      if(master&&context)master.gain.setTargetAtTime(0,context.currentTime,.04);
    }
    updateButton();
  }
  button.addEventListener('click',()=>{
    const audible=desired&&activated&&context?.state==='running';
    desired=!audible;activated=true;
    try{localStorage.setItem('ryansu-rain-sound',desired?'on':'off');}catch{}
    void syncAudio();
  });
  function firstInteraction(event){
    if(activated||!desired||button.contains(event.target))return;
    if(event.type==='keydown'&&!['Enter',' '].includes(event.key))return;
    activated=true;void syncAudio();
  }
  if(AudioEngine){
    document.addEventListener('pointerdown',firstInteraction,{passive:true});
    document.addEventListener('keydown',firstInteraction);
    document.addEventListener('visibilitychange',()=>{if(activated)void syncAudio();});
    updateButton();
  }else{
    button.disabled=true;button.title='Rain sound is unavailable in this browser';
    button.setAttribute('aria-label',button.title);
  }
})();
</script>

    '    vec3 footage=pow(texture2D(skyMap,vec2(u,v)).rgb,vec3(2.2));',
    '    colour=mix(horizon,footage,smoothstep(0.0,0.16,elevation));',
    '    colour=mix(colour,blue,smoothstep(0.92,1.0,elevation));',
    '  }',
    '  return colour;',
    '}'
  ].join('\n');
  const skyMaterial=new THREE.ShaderMaterial({
    uniforms:skyUniforms,side:THREE.BackSide,depthWrite:false,
    vertexShader:'varying vec3 vDirection; void main(){vDirection=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:skyGLSL+'\nvarying vec3 vDirection;\nvoid main(){gl_FragColor=vec4(skyColour(vDirection),1.0);\n#include <colorspace_fragment>\n}'
  });
  const skyDome=new THREE.Mesh(new THREE.SphereGeometry(1100,48,24),skyMaterial);
  skyDome.renderOrder=-10;skyDome.frustumCulled=false;scene.add(skyDome);

  const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.88,flatShading:true});
  const waterTime={value:0};
  const waveGLSL=[
    'uniform float waterTime;',
    'float waveHeight(vec2 p){',
    '  return 0.034*sin(p.x*0.85+waterTime*0.85)+0.022*sin(p.y*1.15-waterTime*0.65)+0.012*sin((p.x+p.y)*1.7+waterTime);',
    '}'
  ].join('\n');
  const waterMaterial=new THREE.ShaderMaterial({
    uniforms:{waterTime,...skyUniforms},
    transparent:true,depthWrite:false,side:THREE.FrontSide,
    vertexShader:waveGLSL+'\nvarying vec3 vWaterPosition;\nvoid main(){vec3 p=position;p.y+=waveHeight(p.xz);vWaterPosition=(modelMatrix*vec4(p,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vWaterPosition,1.0);}',
    fragmentShader:skyGLSL+'\n'+waveGLSL+'\n'+[
      'varying vec3 vWaterPosition;',
      'void main(){',
      ' vec2 p=vWaterPosition.xz;',
      ' float dx=0.0289*cos(p.x*.85+waterTime*.85)+0.0204*cos((p.x+p.y)*1.7+waterTime);',
      ' float dz=0.0253*cos(p.y*1.15-waterTime*.65)+0.0204*cos((p.x+p.y)*1.7+waterTime);',
      ' dx+=0.012*cos(p.x*7.0+p.y*3.0+waterTime*1.2);',
      ' dz+=0.010*sin(p.y*8.0-p.x*2.0-waterTime);',
      ' vec3 normal=normalize(vec3(-dx,1.0,-dz));',
      ' vec3 viewDirection=normalize(cameraPosition-vWaterPosition);',
      ' float fresnel=pow(1.0-max(dot(viewDirection,normal),0.0),3.0);',
      ' vec3 reflected=skyColour(reflect(-viewDirection,normal));',
      ' vec3 colour=mix(vec3(0.10,0.48,0.66),reflected,0.16+0.68*fresnel);',
      ' vec3 sunDirection=normalize(vec3(-0.4,0.8,0.45));',
      ' vec3 halfway=normalize(sunDirection+viewDirection);',
      ' float sparkle=pow(max(dot(normal,halfway),0.0),180.0);',
      ' colour+=vec3(1.0,0.95,0.80)*sparkle*0.65;',
      ' float waveLight=0.5+0.5*sin(p.x*1.3+p.y*.8+waterTime*.6);',
      ' colour+=vec3(0.025,0.045,0.05)*pow(waveLight,12.0);',
      ' float distanceFade=smoothstep(100.0,450.0,length(cameraPosition-vWaterPosition));',
      ' colour=mix(colour,vec3(0.64,0.79,0.88),distanceFade);',
      ' gl_FragColor=vec4(colour,mix(0.38,0.98,max(fresnel,distanceFade)));',
      ' #include <colorspace_fragment>',
      '}'
    ].join('\n')
  });
  // Concentrate vertices around the frogs, leaving a broad surface out to the horizon.
  const waterGeo=new THREE.PlaneGeometry(2000,2000,160,160);
  waterGeo.rotateX(-Math.PI/2);
  const waterPositions=waterGeo.attributes.position;
  for(let i=0;i<waterPositions.count;i++){
    const x=waterPositions.getX(i)/1000,z=waterPositions.getZ(i)/1000;
    waterPositions.setXYZ(i,Math.sign(x)*x*x*1000,0,Math.sign(z)*z*z*1000);
  }
  waterGeo.computeBoundingSphere();
  const water=new THREE.Mesh(waterGeo,waterMaterial);
  water.renderOrder=2;scene.add(water);
  const bed=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshBasicMaterial({color:0x3b9fbe}));
  bed.rotation.x=-Math.PI/2;bed.position.y=-3;scene.add(bed);
  function waveHeight(x,z,t){
    return .034*Math.sin(x*.85+t*.85)+.022*Math.sin(z*1.15-t*.65)+.012*Math.sin((x+z)*1.7+t);
  }
  const green=mat(0x5f9c59),greenEdge=mat(0x4c8950);
  const black=new THREE.MeshBasicMaterial({color:0x111111});
  const faceted=new THREE.SphereGeometry(1,8,5);
  const eyeGeometry=new THREE.SphereGeometry(1,12,8);
  function mesh(parent,material,pos,scale,geometry=faceted){
    const m=new THREE.Mesh(geometry,material);m.position.set(...pos);m.scale.set(...scale);
    m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
  }
  function lily(parent,radius=1.65,turn=0){
    const shape=new THREE.Shape();
    shape.moveTo(0,0);
    for(let n=0;n<=30;n++){
      const a=.23+(Math.PI*2-.46)*n/30;
      const edge=radius*(1+.025*Math.sin(a*3+turn)+.018*Math.cos(a*5-turn));
      shape.lineTo(Math.cos(a)*edge,Math.sin(a)*edge);
    }
    shape.lineTo(0,0);
    const geometry=new THREE.ExtrudeGeometry(shape,{depth:.075,bevelEnabled:false,steps:1});
    geometry.rotateX(-Math.PI/2);
    const pad=new THREE.Mesh(geometry,[green,greenEdge]);
    pad.rotation.y=turn;pad.receiveShadow=true;pad.castShadow=true;parent.add(pad);
  }
  function frog(parent,color,index){
    const f=new THREE.Group();f.position.y=.09;parent.add(f);
    const skin=mat(color);
    mesh(f,skin,[0,.5,-.1],[.76,.5,.66]);
    mesh(f,skin,[0,.88,.25],[.85,.43,.53]);
    for(const side of [-1,1]){
      mesh(f,skin,[side*.7,.22,-.05],[.38,.23,.43]);
      mesh(f,skin,[side*.43,.12,.57],[.19,.12,.27]);
      mesh(f,skin,[side*.43,1.16,.3],[.25,.25,.24]);
      mesh(f,black,[side*.43,1.19,.525],[.085,.085,.055],eyeGeometry);
    }
    f.rotation.y=[.18,-.25,.12,-.16][index];
    return f;
  }
  const positions=[[-4,-1.4],[1.4,-3.4],[-1.9,3.2],[4,2.1]];
  const islands=[],targets=[],ripples=[];
  positions.forEach(([x,z],i)=>{
    const group=new THREE.Group();group.position.set(x,.07,z);scene.add(group);
    const padGroup=new THREE.Group();group.add(padGroup);
    lily(padGroup,[1.68,1.76,1.62,1.72][i],i*.8+.4);
    padGroup.scale.set([1.04,.98,1.06,1.01][i],1,[.97,1.04,.96,1.03][i]);
    const model=frog(group,colors[i],i);
    group.traverse(obj=>{if(obj.isMesh){obj.userData.section=i;targets.push(obj);}});
    islands.push({group,model,x,z,heading:model.rotation.y});
    for(let n=0;n<2;n++){
      const ring=new THREE.Mesh(new THREE.RingGeometry(1.85+n*.38,1.87+n*.38,64),new THREE.MeshBasicMaterial({color:0xd6f5ff,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}));
      ring.rotation.x=-Math.PI/2;ring.renderOrder=3;ring.position.set(x,.08+n*.008,z);scene.add(ring);ripples.push({ring,phase:i+n*2,islandIndex:i});
    }
  });

  const lotusFlowers=[];
  const petalWhite=mat(0xffe9ed),petalPink=mat(0xf2a8c6),petalInner=mat(0xffc9df),pollen=mat(0xf6ce68);
  function lotus(x,z,size,phase){
    const group=new THREE.Group();scene.add(group);
    lily(group,.92,phase);
    const flower=new THREE.Group();flower.position.y=.09;group.add(flower);
    // Two loose rings of petals around a small golden centre.
    for(let layer=0;layer<2;layer++){
      const count=layer?6:8;
      for(let i=0;i<count;i++){
        const angle=i/count*Math.PI*2+layer*.35;
        const petal=mesh(flower,layer?petalInner:(i%2?petalWhite:petalPink),
          [Math.sin(angle)*(layer?.18:.33),layer?.26:.15,Math.cos(angle)*(layer?.18:.33)],
          [layer?.13:.17,layer?.25:.11,layer?.26:.43]);
        petal.rotation.y=angle;petal.rotation.x=layer?-.38:-.16;
      }
    }
    mesh(flower,pollen,[0,.34,0],[.17,.10,.17]);
    group.scale.setScalar(size);
    lotusFlowers.push({group,x,z,phase});
  }
  lotus(-6.4,.4,.85,0);lotus(5.9,.2,.95,2);
  lotus(-.4,-5.5,.7,4);lotus(1,5.8,.8,6);
  lotus(-7,-4.8,.62,8);lotus(6.6,5.2,.65,10);

  const koi=[];
  const koiWhite=mat(0xfff5df),koiOrange=mat(0xe97d36),koiBlack=mat(0x354645),koiGold=mat(0xe7b75c);
  function fin(parent,material,points){
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(points,3));geometry.computeVertexNormals();
    const m=new THREE.Mesh(geometry,material);m.material=material.clone();m.material.side=THREE.DoubleSide;
    parent.add(m);return m;
  }
  for(let i=0;i<6;i++){
    const fish=new THREE.Group();scene.add(fish);
    const body=new THREE.Group();fish.add(body);
    const base=i===4?koiGold:koiWhite;
    mesh(body,base,[0,0,0],[.23,.15,.66]);
    mesh(body,base,[0,-.015,.5],[.17,.13,.24]);
    // Raised, flattened colour patches read clearly through the water.
    mesh(body,i===4?koiWhite:koiOrange,[-.055,.125,.22],[.15,.035,.20]);
    mesh(body,koiOrange,[.045,.115,-.26],[.15,.035,.17]);
    if(i%2===0)mesh(body,koiBlack,[.08,.13,-.04],[.10,.028,.11]);
    const tail=new THREE.Group();tail.position.z=-.57;body.add(tail);
    fin(tail,koiOrange,[0,0,.06,-.32,.015,-.43,0,0,-.31,0,0,.06,0,0,-.31,.32,.015,-.43]);
    const left=fin(body,base,[-.13,0,.2,-.43,-.02,-.05,-.15,0,-.12]);
    const right=fin(body,base,[.13,0,.2,.15,0,-.12,.43,-.02,-.05]);
    for(const side of [-1,1])mesh(body,black,[side*.115,.075,.61],[.026,.026,.026],eyeGeometry);
    fish.scale.setScalar(.8+(i%3)*.12);
    fish.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
    koi.push({fish,body,tail,left,right,phase:i*Math.PI/3,rx:4.6+(i%3)*.65,rz:3.8+(i%2)*.7,speed:(i%2?-1:1)*(.075+i*.008),depth:-.48-(i%3)*.10});
  }


  // Short mesh streaks retain visible thickness on high-density displays.
  const drizzleCount=88;
  const rainGeometry=new THREE.CylinderGeometry(.5,.28,1,5);
  const rainMaterial=new THREE.MeshBasicMaterial({color:0xe9f8ff,transparent:true,opacity:.85,depthWrite:false});
  const drizzle=new THREE.InstancedMesh(rainGeometry,rainMaterial,drizzleCount);
  drizzle.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  drizzle.frustumCulled=false;drizzle.renderOrder=4;scene.add(drizzle);
  const dropTransform=new THREE.Object3D();
  const splashGeometry=new THREE.RingGeometry(.82,1,40);
  const drizzleDrops=[];
  const rainHash=(n)=>{const value=Math.sin(n*127.1+311.7)*43758.5453;return value-Math.floor(value);};
  for(let i=0;i<drizzleCount;i++){
    const makeRing=()=>{
      const ring=new THREE.Mesh(splashGeometry,new THREE.MeshBasicMaterial({
        color:0xe5f8ff,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false
      }));
      ring.rotation.x=-Math.PI/2;ring.renderOrder=3;ring.visible=false;scene.add(ring);
      return ring;
    };
    drizzleDrops.push({
      splash:makeRing(),echo:makeRing(),
      period:3.8+rainHash(i+4)*1.5,offset:rainHash(i+8)*6,
      height:5.5+rainHash(i+12)*2.5,speed:4.6+rainHash(i+17)*1.08
    });
  }

  const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
  let hover=-1,down=null,dragged=false,pointerCount=0;
  function hit(event){
    const b=renderer.domElement.getBoundingClientRect();
    pointer.set((event.clientX-b.left)/b.width*2-1,-(event.clientY-b.top)/b.height*2+1);
    raycaster.setFromCamera(pointer,camera);
    const result=raycaster.intersectObjects(targets,false)[0];
    return result?result.object.userData.section:-1;
  }
  renderer.domElement.addEventListener('pointerdown',e=>{
    pointerCount++;if(pointerCount>1) dragged=true;
    if(pointerCount===1){down={x:e.clientX,y:e.clientY,id:e.pointerId};dragged=false;}
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)dragged=true;
    hover=dragged?-1:hit(e);
    renderer.domElement.style.cursor=down?'grabbing':hover>=0?'pointer':'grab';
  });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(down&&e.pointerId===down.id&&!dragged&&!dialog.open){
      const i=hit(e);if(i>=0)openSection(i);
    }
    pointerCount=Math.max(0,pointerCount-1);
    if(!pointerCount){down=null;dragged=false;}
  });
  renderer.domElement.addEventListener('pointercancel',()=>{down=null;pointerCount=0;dragged=false;});
  renderer.domElement.addEventListener('pointerleave',()=>{hover=-1;});
  const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
  let paused=motionPreference.matches;
  let skyPlaybackWanted=false;
  function syncSkyPlayback(){
    const wanted=!paused&&!dialog.open&&!document.hidden&&!skyVideoFailed;
    if(wanted===skyPlaybackWanted)return;
    skyPlaybackWanted=wanted;
    if(!wanted){skyVideo.pause();return;}
    if(videoPlayPending)return;
    videoPlayPending=true;
    skyVideo.play().catch(()=>{/* Retry on the next user gesture or visibility change. */}).finally(()=>{videoPlayPending=false;});
  }
  // A gesture can resume video on browsers that block muted autoplay.
  renderer.domElement.addEventListener('pointerdown',()=>{skyPlaybackWanted=false;syncSkyPlayback();});
  document.addEventListener('visibilitychange',()=>{skyPlaybackWanted=false;syncSkyPlayback();});
  dialog.addEventListener('close',()=>{skyPlaybackWanted=false;syncSkyPlayback();});
  const motionButton=document.querySelector('#motion'),resetButton=document.querySelector('#reset');
  motionButton.hidden=false;resetButton.hidden=false;
  function motionLabel(){motionButton.textContent=paused?'▷':'Ⅱ';motionButton.setAttribute('aria-label',paused?'Resume pond animation':'Pause pond animation');motionButton.title=paused?'Resume animation':'Pause animation';}
  motionLabel();
  motionButton.addEventListener('click',()=>{paused=!paused;motionLabel();syncSkyPlayback();});
  motionPreference.addEventListener('change',e=>{paused=e.matches;motionLabel();syncSkyPlayback();});
  resetButton.addEventListener('click',()=>controls.reset());
  let fitted=false;
  function resize(){
    const w=host.clientWidth,h=Math.max(host.clientHeight,1),aspect=w/h;
    camera.aspect=aspect;camera.updateProjectionMatrix();
    if(!fitted){
      const verticalFov=THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*aspect);
      const distance=Math.max(23,7.1/Math.tan(horizontalFov/2));
      camera.position.copy(controls.target).add(new THREE.Vector3(0,12,19).normalize().multiplyScalar(distance));
      controls.maxDistance=Math.max(65,distance*1.5);
      controls.update();controls.saveState();fitted=true;
    }
    renderer.setSize(w,h);
  }
  new ResizeObserver(resize).observe(host);resize();
  let time=0,last=0;
  function render(now){
    const dt=Math.min((now-last)/1000,.05);last=now;
    syncSkyPlayback();
    if(document.hidden)return;
    controls.enabled=!dialog.open;controls.update();
    if(!paused&&!dialog.open)time+=dt;
    waterTime.value=time;
    skyDome.position.copy(camera.position);
    lotusFlowers.forEach(({group,x,z,phase})=>{
      group.position.set(x+Math.sin(time*.12+phase)*.18,.055+waveHeight(x,z,time),z+Math.cos(time*.10+phase)*.14);
      group.rotation.set(Math.sin(time*.7+phase)*.025,Math.sin(time*.10+phase)*.12,Math.cos(time*.6+phase)*.025);
    });
    koi.forEach(({fish,body,tail,left,right,phase,rx,rz,speed,depth})=>{
      const a=time*speed+phase;
      const x=Math.cos(a)*rx,z=Math.sin(a)*rz;
      fish.position.set(x,depth+Math.sin(time*.6+phase)*.035,z);
      fish.rotation.y=Math.atan2(-Math.sin(a)*rx*speed,Math.cos(a)*rz*speed);
      body.rotation.y=Math.sin(time*2.8+phase)*.045;
      tail.rotation.y=Math.sin(time*3.8+phase)*.32;
      left.rotation.z=Math.sin(time*2+phase)*.16;
      right.rotation.z=-Math.sin(time*2+phase)*.16;
    });
    islands.forEach((island,i)=>{
      const phase=i*1.9;
      const x=island.x+Math.sin(time*.16+phase)*.19;
      const z=island.z+Math.cos(time*.13+phase)*.16;
      island.group.position.set(x,.065+waveHeight(x,z,time),z);
      island.group.rotation.set(Math.sin(time*.62+phase)*.018,
        Math.sin(time*.10+phase)*.045,Math.sin(time*.72+phase)*.022);
      // Rigid movements preserve the frogs' original geometry and proportions.
      const cycle=(time+i*5.3)%24;
      const hop=cycle>18&&cycle<18.85?Math.sin((cycle-18)/.85*Math.PI)*.13:0;
      island.model.position.y=.09+hop;
      island.model.rotation.y=island.heading+Math.sin(time*.35+phase)*.055;
      island.model.rotation.x=Math.sin(time*.8+phase)*.018;
      const active=hover===i;
      const target=active?1.055:1;
      island.model.scale.lerp(new THREE.Vector3(target,target,target),paused?1:.12);
    });
    ripples.forEach(({ring,phase,islandIndex})=>{
      const p=(time*.16+phase*.31)%1;
      const centre=islands[islandIndex].group.position;
      ring.position.set(centre.x,.08+waveHeight(centre.x,centre.z,time),centre.z);
      ring.scale.setScalar(1+p*.3);ring.material.opacity=.18*(1-p);
    });
    const rainPixelScale=2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)/Math.max(host.clientHeight,1);
    drizzleDrops.forEach(({splash,echo,period,offset,height,speed},i)=>{
      const elapsed=time+offset,cycle=Math.floor(elapsed/period),age=elapsed%period;
      const seed=i*19+cycle*61;
      const x=(rainHash(seed+1)-.5)*20,z=(rainHash(seed+2)-.5)*20;
      const fallDuration=height/speed;
      if(age<fallDuration){
        const y=height-age*speed+waveHeight(x,z,time);
        const lean=(fallDuration-age)*.08;
        dropTransform.position.set(x-lean,y,z);
        const pixelSize=rainPixelScale*camera.position.distanceTo(dropTransform.position);
        const width=THREE.MathUtils.clamp(pixelSize*1.8,.025,.065);
        const length=THREE.MathUtils.clamp(pixelSize*(10+rainHash(i)*5),.20,.48);
        dropTransform.scale.set(width,length,width);
        dropTransform.rotation.set(0,0,.02);
        // The lower tip meets the water at the same point that starts the rings.
        dropTransform.position.y+=length*.5;
      }else{
        dropTransform.position.set(x,-5,z);dropTransform.scale.set(0,0,0);
      }
      dropTransform.updateMatrix();drizzle.setMatrixAt(i,dropTransform.matrix);
      const splashAge=age-fallDuration;
      const clearWater=!islands.some(({group})=>Math.hypot(group.position.x-x,group.position.z-z)<1.95)
        &&!lotusFlowers.some(({group})=>Math.hypot(group.position.x-x,group.position.z-z)<1.05);
      [splash,echo].forEach((ring,j)=>{
        const ringAge=splashAge-j*.22;
        ring.visible=ringAge>=0&&ringAge<1.35&&clearWater;
        if(ring.visible){
          const progress=ringAge/1.35;
          ring.position.set(x,.065+waveHeight(x,z,time)+j*.003,z);
          ring.scale.setScalar(.07+progress*.49);
          ring.material.opacity=(j?.38:.64)*Math.min(progress*9,1)*Math.pow(1-progress,1.15);
        }
      });
    });
    drizzle.instanceMatrix.needsUpdate=true;
    renderer.render(scene,camera);
  }
  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();renderer.setAnimationLoop(null);skyVideoFailed=true;skyVideo.pause();window.pondFailed();});
  renderer.setAnimationLoop(render);
  window.pondReady();
} catch(error) {
  console.error('Pond initialization failed:',error);
  window.pondFailed();
}
</script>
</body>
</html>
