<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#203b3d;background:#67bede;font-synthesis:none}

.toolbar{position:fixed;z-index:4;bottom:24px;right:24px;display:flex;gap:8px}.utility{border:1px solid #ffffff66;border-radius:50%;height:34px;width:34px;background:#ffffff99;display:grid;place-items:center;font-size:17px}.utility:hover{background:#fff}.utility[hidden]{display:none}

nav:focus-within,body.fallback nav{position:relative;width:auto;height:auto;margin:0;clip-path:none;white-space:normal;display:flex;gap:6px;flex-wrap:wrap;background:#ffffffed;padding:8px;border-radius:12px}

<script>

const sections = ["\n    \u003ch2>Hobbies\u003c/h2>\n    \u003cul>\n      \u003cli>Piano\u003c/li>\n      \u003cli>Saxophone and jazz band\u003c/li>\n      \u003cli>Gardening\u003c/li>\n    \u003c/ul>\n  ","\n    \u003ch2>Cross Country\u003c/h2>\n    \u003cp class=\"result\">\u003ca href=\"https://www.trackdatabase.com/viewmeet.php?current_meet=zzzz_db1752&amp;meet=enp6el9kYjE3NTI=&amp;Evt=638\">Huron Heights Harrier XC\u003c/a> — 9th of 176 as a junior.\u003c/p>\n    \u003cp class=\"result\">\u003ca href=\"https://www.trackdatabase.com/viewmeet.php?current_meet=zzzz_db1827&amp;meet=enp6el9kYjE4Mjc=&amp;Evt=4\">CISAA\u003c/a> — 9th of 89.\u003c/p>\n    \u003cp class=\"result\">\u003ca href=\"https://www.trackdatabase.com/viewmeet.php?current_meet=zzzz_db1749&amp;meet=enp6el9kYjE3NDk=&amp;Evt=682\">OFSAA Provincials\u003c/a> — 132nd of 276.\u003c/p>\n  ","\n    \u003ch2>Debate\u003c/h2>\n    \u003ch3>Leadership and initiatives\u003c/h3>\n    \u003cul>\n      \u003cli>Co-tournament director of Argu-Mint Cup, a tournament with over 100 debaters.\u003c/li>\n      \u003cli>Co-tournament director of the Speech and Debate Canada Invitational, with over 120 debaters from 16 countries and a $550 prize pool.\u003c/li>\n      \u003cli>Secured a $300 sponsorship from the Speech and Debate Canada Foundation.\u003c/li>\n      \u003cli>Started a coaching service connecting experienced high school debaters with new debaters, raising $120 for tournament fees.\u003c/li>\n      \u003cli>Hosted a seminar featuring a Team Canada debate member.\u003c/li>\n      \u003cli>Made outrounds at several tournaments and qualified for Junior Nationals CNDF.\u003c/li>\n    \u003c/ul>\n\n    \u003ch3>Tournament results\u003c/h3>\n    \u003cul>\n      \u003cli>\u003ca href=\"https://vwsdc2026.calicotab.com/vwsdc2026/\">Vancouver WSDC\u003c/a> — Open Octofinals, 15th Open Team, 23rd U16 Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qhst2026.calicotab.com/qhst2026/\">Queens HST 2026\u003c/a> — Open Quarterfinals, 4th Open Team, 1st Junior Team, 4th Junior Speaker, 12th Open Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://hhwo26.calicotab.com/hhwo26/\">Hart House Winter Open\u003c/a> — 9th Open Team Reserve Break, 2nd Junior Speaker, 19th Open Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qho2025.calicotab.com/_/\">Queens Holiday Open\u003c/a> — Open Partial Quarterfinalist, 10th Junior Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qbs2025.calicotab.com/qbts2025/\">Queens Back To School\u003c/a> — Open Grand Finalist, 2nd Junior Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://qhst2025.calicotab.com/QHST2025/\">Queens HST 2025\u003c/a> — Junior Champion, 11th Junior Speaker.\u003c/li>\n      \u003cli>\u003ca href=\"https://waterloohst.calicotab.com/uwspringhst2025/\">Waterloo HST\u003c/a> — Open Quarterfinals, 18th Junior Speaker.\u003c/li>\n    \u003c/ul>\n  ","\n    \u003ch2>Other activities\u003c/h2>\n    \u003cul>\n      \u003cli>Outreach Manager at the CYCS 2026 Leadership Summit.\u003c/li>\n      \u003cli>Member of the UCC Sustainability Council.\u003c/li>\n      \u003cli>Shortlisted for the John Locke Essay Competition junior pool, receiving a commendation. \u003ca href=\"https://docs.google.com/document/d/1MCnwodJLQJXwShR193iVUNzWTWHSKNBJBhwnnqYi-rY/edit?usp=sharing\">Read the essay\u003c/a>.\u003c/li>\n      \u003cli>Political canvassing for Vincent Ke and Weidong Pei, trustee.\u003c/li>\n    \u003c/ul>\n  "];
const names = ['Hobbies','Cross Country','Debate','Other Activities'];
const colors = ['#78ad50','#e6ac40','#a18bd0','#e7867d'];
const dialog = document.querySelector('dialog');
const modalBody = document.querySelector('.modal-body');
let returnFocus = null;
function openSection(index, source) {
  returnFocus = source || document.querySelector('nav button[data-index="'+index+'"]');
  modalBody.innerHTML = sections[index];
  modalBody.querySelector('h2').id = 'section-title';
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}
document.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{
  const b=dialog.getBoundingClientRect();
  if(e.target===dialog && (e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)) dialog.close();
});
dialog.addEventListener('close',()=>{if(returnFocus) returnFocus.focus({preventScroll:true});});
names.forEach((name,i)=>{
  const b=document.createElement('button');
  b.type='button';b.dataset.index=i;b.setAttribute('aria-haspopup','dialog');
  b.textContent=name;
  b.addEventListener('click',()=>openSection(i,b));
  document.querySelector('nav').append(b);
});
window.pondUI = {openSection,names,colors,dialog};
const loadingTimeout=setTimeout(()=>{
  const status=document.querySelector('#status');
  if(!status.hidden) {status.textContent='Still loading…';document.body.classList.add('fallback');}
},12000);
window.pondReady=()=>{clearTimeout(loadingTimeout);document.querySelector('#status').hidden=true;document.body.classList.remove('fallback');};
window.pondFailed=()=>{
  clearTimeout(loadingTimeout);
  const s=document.querySelector('#status');s.hidden=false;
  s.textContent='3D unavailable.';
  document.body.classList.add('fallback');
};
</script>
<script type="module">
try {
  const [THREE, {OrbitControls}] = await Promise.all([import('three'),import('three/addons/controls/OrbitControls.js')]);
  const host=document.querySelector('#pond');
  const {openSection,names,colors,dialog}=window.pondUI;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0xffffff);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  host.prepend(renderer.domElement);
  renderer.domElement.setAttribute('aria-hidden','true');
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xffffff);
  scene.fog=new THREE.Fog(0xffffff,100,350);
  const camera=new THREE.PerspectiveCamera(42,1,.1,1500);
  camera.position.set(0,12.65,19);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,.65,0);
  controls.enableDamping=true;controls.dampingFactor=.07;
  controls.enablePan=false;
  controls.minPolarAngle=.2;controls.maxPolarAngle=Math.PI/2;
  controls.minDistance=10;controls.maxDistance=65;
  controls.rotateSpeed=.55;
  controls.update();controls.saveState();
  scene.add(new THREE.HemisphereLight(0xffffff,0xb1d4dc,2.5));
  const sun=new THREE.DirectionalLight(0xfff7df,3.1);
  sun.position.set(-7,15,8);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:.5,far:50});
  sun.shadow.normalBias=.025;sun.shadow.bias=-.0002;
  scene.add(sun);
  const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.88,flatShading:true});
  const waterMaterial=new THREE.MeshStandardMaterial({color:0x67bede,roughness:.38,metalness:.04,flatShading:true});
  const waterGeo=new THREE.PlaneGeometry(2000,2000);
  waterGeo.rotateX(-Math.PI/2);
  const water=new THREE.Mesh(waterGeo,waterMaterial);
  water.receiveShadow=true;scene.add(water);
  const green=mat(0x5f9c59),greenEdge=mat(0x4c8950);
  const black=new THREE.MeshBasicMaterial({color:0x111111});
  const faceted=new THREE.SphereGeometry(1,8,5);
  const eyeGeometry=new THREE.SphereGeometry(1,12,8);
  function mesh(parent,material,pos,scale,geometry=faceted){
    const m=new THREE.Mesh(geometry,material);m.position.set(...pos);m.scale.set(...scale);
    m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
  }
  function lily(parent,radius=1.65,turn=0){
    const shape=new THREE.Shape();
    shape.moveTo(0,0);
    for(let n=0;n<=30;n++){
      const a=.23+(Math.PI*2-.46)*n/30;
      shape.lineTo(Math.cos(a)*radius,Math.sin(a)*radius);
    }
    shape.lineTo(0,0);
    const geometry=new THREE.ExtrudeGeometry(shape,{depth:.075,bevelEnabled:false,steps:1});
    geometry.rotateX(-Math.PI/2);
    const pad=new THREE.Mesh(geometry,[green,greenEdge]);
    pad.rotation.y=turn;pad.receiveShadow=true;pad.castShadow=true;parent.add(pad);
  }
  function frog(parent,color,index){
    const f=new THREE.Group();f.position.y=.09;parent.add(f);
    const skin=mat(color);
    mesh(f,skin,[0,.5,-.1],[.76,.5,.66]);
    mesh(f,skin,[0,.88,.25],[.85,.43,.53]);
    for(const side of [-1,1]){
      mesh(f,skin,[side*.7,.22,-.05],[.38,.23,.43]);
      mesh(f,skin,[side*.43,.12,.57],[.19,.12,.27]);
      mesh(f,skin,[side*.43,1.16,.3],[.25,.25,.24]);
      mesh(f,black,[side*.43,1.19,.525],[.085,.085,.055],eyeGeometry);
    }
    f.rotation.y=[.18,-.25,.12,-.16][index];
    return f;
  }
  const positions=[[-3.3,-2.6],[3.3,-2.6],[-3.3,3],[3.3,3]];
  const islands=[],targets=[],ripples=[];
  positions.forEach(([x,z],i)=>{
    const group=new THREE.Group();group.position.set(x,.07,z);scene.add(group);
    lily(group,1.7,i*.8+.4);
    const model=frog(group,colors[i],i);
    group.traverse(obj=>{if(obj.isMesh){obj.userData.section=i;targets.push(obj);}});
    islands.push({group,model});
    for(let n=0;n<2;n++){
      const ring=new THREE.Mesh(new THREE.RingGeometry(1.85+n*.38,1.87+n*.38,64),new THREE.MeshBasicMaterial({color:0xd6f5ff,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}));
      ring.rotation.x=-Math.PI/2;ring.position.set(x,.035+n*.008,z);scene.add(ring);ripples.push({ring,phase:i+n*2});
    }
  });
  const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
  let hover=-1,down=null,dragged=false,pointerCount=0;
  function hit(event){
    const b=renderer.domElement.getBoundingClientRect();
    pointer.set((event.clientX-b.left)/b.width*2-1,-(event.clientY-b.top)/b.height*2+1);
    raycaster.setFromCamera(pointer,camera);
    const result=raycaster.intersectObjects(targets,false)[0];
    return result?result.object.userData.section:-1;
  }
  renderer.domElement.addEventListener('pointerdown',e=>{
    pointerCount++;if(pointerCount>1) dragged=true;
    if(pointerCount===1){down={x:e.clientX,y:e.clientY,id:e.pointerId};dragged=false;}
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)dragged=true;
    hover=dragged?-1:hit(e);
    renderer.domElement.style.cursor=down?'grabbing':hover>=0?'pointer':'grab';
  });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(down&&e.pointerId===down.id&&!dragged&&!dialog.open){
      const i=hit(e);if(i>=0)openSection(i);
    }
    pointerCount=Math.max(0,pointerCount-1);
    if(!pointerCount){down=null;dragged=false;}
  });
  renderer.domElement.addEventListener('pointercancel',()=>{down=null;pointerCount=0;dragged=false;});
  renderer.domElement.addEventListener('pointerleave',()=>{hover=-1;});
  const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
  let paused=motionPreference.matches;
  const motionButton=document.querySelector('#motion'),resetButton=document.querySelector('#reset');
  motionButton.hidden=false;resetButton.hidden=false;
  function motionLabel(){motionButton.textContent=paused?'▷':'Ⅱ';motionButton.setAttribute('aria-label',paused?'Resume pond animation':'Pause pond animation');motionButton.title=paused?'Resume animation':'Pause animation';}
  motionLabel();
  motionButton.addEventListener('click',()=>{paused=!paused;motionLabel();});
  motionPreference.addEventListener('change',e=>{paused=e.matches;motionLabel();});
  resetButton.addEventListener('click',()=>controls.reset());
  let fitted=false;
  function resize(){
    const w=host.clientWidth,h=Math.max(host.clientHeight,1),aspect=w/h;
    camera.aspect=aspect;camera.updateProjectionMatrix();
    if(!fitted){
      const verticalFov=THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*aspect);
      const distance=Math.max(23,7.1/Math.tan(horizontalFov/2));
      camera.position.copy(controls.target).add(new THREE.Vector3(0,12,19).normalize().multiplyScalar(distance));
      controls.maxDistance=Math.max(65,distance*1.5);
      controls.update();controls.saveState();fitted=true;
    }
    renderer.setSize(w,h);
  }
  new ResizeObserver(resize).observe(host);resize();
  let time=0,last=0;
  function render(now){
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(document.hidden)return;
    controls.enabled=!dialog.open;controls.update();
    if(!paused&&!dialog.open)time+=dt;
    islands.forEach((island,i)=>{
      island.group.position.y=.07+Math.sin(time*1.15+i*1.8)*.035;
      island.group.rotation.z=Math.sin(time*.8+i)*.012;
      const active=hover===i;
      const target=active?1.055:1;
      island.model.scale.lerp(new THREE.Vector3(target,target,target),paused?1:.12);
    });
    ripples.forEach(({ring,phase})=>{const p=(time*.16+phase*.31)%1;ring.scale.setScalar(1+p*.3);ring.material.opacity=.32*(1-p);});
    renderer.render(scene,camera);
  }
  renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();renderer.setAnimationLoop(null);window.pondFailed();});
  renderer.setAnimationLoop(render);
  window.pondReady();
} catch(error) {
  console.error('Pond initialization failed:',error);
  window.pondFailed();
}
</script>
